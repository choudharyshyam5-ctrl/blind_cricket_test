function reqLine(req,p){
 let parts=[];
 if(req.matches)parts.push({label:"matches",need:req.matches,have:p.matches});
 if(req.wins)parts.push({label:"wins",need:req.wins,have:p.wins});
 if(req.runs)parts.push({label:"runs",need:req.runs,have:p.runs});
 if(req.wickets)parts.push({label:"wickets",need:req.wickets,have:p.wickets});
 if(req.fifties)parts.push({label:"fifties",need:req.fifties,have:p.fifties});
 if(req.centuries)parts.push({label:"centuries",need:req.centuries,have:p.centuries});
 if(req.captainMatches)parts.push({label:"matches as captain",need:req.captainMatches,have:p.captainMatches||0});
 if(req.tournamentsWon)parts.push({label:"tournaments won",need:req.tournamentsWon,have:p.tournamentsWon||0});
 return parts;
}
function meetsReq(req,p){return reqLine(req,p).every(x=>x.have>=x.need)}

function gameDay(d=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function dayBefore(day){const [y,m,d]=day.split("-").map(Number);return new Date(Date.UTC(y,m-1,d-1)).toISOString().slice(0,10)}
function dailyTarget(day){const n=Number(day.replace(/-/g,""));return 12+(n%4)*2+Math.min(27,Math.max(0,(Number(player?.level)||1)-1)*3)} // In-game target grows 3 runs per career level, capped at +27.
async function claimDailyLogin(uid){
 if(dailyClaimBusy||!canChangeProfile()||auth.currentUser?.uid!==uid||player.loginReward?.day===gameDay())return;
 dailyClaimBusy=true;const generation=authLoadGeneration;
 const dailyJob=profileWriteQueue.catch(()=>{}).then(async()=>{
  const today=gameDay();try{
   if(authLoadGeneration!==generation||auth.currentUser?.uid!==uid||player.uid!==uid)throw Error("Account changed before reward.");
   const ref=doc(db,"players",uid);let expected=null;
   const result=await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);if(!snap.exists())return null;
    const live=snap.data();if(cloudChanged(uid,live))throw Error("Cloud changed before daily reward. Compare copies first.");
    if(authLoadGeneration!==generation||auth.currentUser?.uid!==uid)throw Error("Account changed during reward.");
    const prior=live.loginReward||{};
    if(prior.day===today){expected=cloudSignature(live);return {already:true}}
    const streak=prior.day===dayBefore(today)?Math.min(7,(Number(prior.streak)||0)+1):1,bonus=50+10*(streak-1);
    const update={loginReward:{day:today,streak},balance:(Number(live.balance)||0)+bonus};
    expected=cloudSignature({...live,...update});tx.update(ref,update);return {streak,bonus};
   });
   if(!result)return;
   const saved=await getDocFromServer(ref);
   if(!saved.exists()||authLoadGeneration!==generation||auth.currentUser?.uid!==uid||player.uid!==uid||cloudSignature(saved.data())!==expected)throw Error("Could not verify the exact daily reward profile. Compare copies first.");
   // Add only this reward; keep money earned locally before or during the readback.
   player.balance=(Number(player.balance)||0)+(result.bonus||0);player.loginReward=saved.data().loginReward;
   recordCloudBaseline(uid,saved.data());rememberEconomy(uid,saved.data());saveLocal();
   if(!result.already)announce("Daily login: "+money(result.bonus)+" game money. Streak "+result.streak+" days.",true);render();
  }catch(x){console.warn("daily login reward",x);saveCloudFailure(uid,"Daily login reward not verified. Compare copies before another save.");if(auth.currentUser?.uid===uid){syncStatus="Daily login reward could not be verified ("+(x.code||x.message||"network-error")+"). Compare cloud and phone copies before another save.";announce(syncStatus,true);render()}}
 });
 profileWriteQueue=dailyJob;try{await dailyJob}finally{dailyClaimBusy=false}
}

function tournamentOpponent(){
 const pool=Object.keys(SQUADS), prior=player.offlineTournament?.opponents||[];
 const unused=pool.filter(id=>!prior.includes(id));
 const candidates=unused.length?unused:pool;

}

 if(squadDraft.length!==15){page="mySquad";msg="New team tournaments need a 15-player squad. Existing 11-player teams still work in Team Versus Computer.";announce(msg,true);render();return}
 player.offlineTournament={id,status:"active",round:1,wins:0,losses:0,requiredWins:OFFLINE_TOURNAMENT_ROUNDS,opponents:[],roster:JSON.parse(JSON.stringify(squadDraft))};

}

async function loadAdminBatch(){

 adminLoading=true;adminError="";render();
 try{
  const constraints=[limit(100)];if(adminLastDoc)constraints.push(startAfter(adminLastDoc));
  const snap=await getDocs(query(collection(db,"players"),...constraints));
  if(!isAdmin()){adminRecords=[];adminLastDoc=null;return}
  adminRecords.push(...snap.docs.map(d=>({id:d.id,data:d.data()})));
  if(snap.docs.length)adminLastDoc=snap.docs[snap.docs.length-1];
  adminAllLoaded=snap.docs.length<100;

 finally{adminLoading=false;if(page==="admin")render()}
}

async function decideTrade(id,accept,automatic=false){
 if(economyBusy)return false;
 if(resumableMatch()){tradeError="Finish or quit your saved match before collecting or buying items.";announce(tradeError,true);render();return false}
 const offered=itemNotificationRows.find(r=>r.id===id)||incomingTrades.find(r=>r.id===id);
 if(accept&&!automatic&&!confirm("Confirm "+(offered?.kind==="sale"?"purchase for "+money(offered.price)+" virtual money":"gift collection")+" of "+(SHOP.find(i=>i.id===offered?.itemId)?.name||"this item")+" from "+(offered?.fromName||offered?.fromUid||"the sender")+"?"))return false;
 economyBusy=true;
 const uid=auth.currentUser?.uid,ref=doc(db,"itemRequests",id);
 let expectedOwnSignature=null;try{
  if(!await pushCloud())throw Error(err||"Save first before changing items.");

  const localBefore=cloudSignature(sanitizeForCloud(player));
  await runTransaction(db,async tx=>{
   const request=await tx.get(ref);if(!request.exists())throw Error("Request not found.");
   const r=request.data();if(accept&&!automatic&&offered&&(r.itemId!==offered.itemId||r.price!==offered.price||r.fromUid!==offered.fromUid||r.kind!==offered.kind))throw Error("Offer changed since confirmation. Refresh before buying.");if(automatic&&(r.kind!=="gift"||r.price!==0))throw Error("Automatic collection only applies to free gifts.");if(!SHOP.some(it=>it.id===r.itemId)||!Number.isSafeInteger(r.price)||r.price<0||(r.kind==="gift"&&r.price!==0))throw Error("Invalid item request. Contact the game owner.");if(r.toUid!==uid||r.status!=="pending")throw Error("Request already handled or not yours.");
   const senderRef=doc(db,"players",r.fromUid),receiverRef=doc(db,"players",uid);
   const sender=null; // No read of another player's private profile. Rules validate atomic credits/returns.
   const receiver=accept?await tx.get(receiverRef):null;
   if(accept&&!receiver?.exists())throw Error("Player profile missing.");
   if(receiver?.exists()&&cloudChanged(uid,receiver.data()))throw Error("Your cloud profile changed. Trade stopped; compare copies first.");
   if((sender&&!sender.exists())||(receiver&&!receiver.exists()))throw Error("Player profile missing.");
   if(accept){
    if(receiver.data().inventory?.[r.itemId])throw Error("You already own this item.");
    if((receiver.data().balance||0)<r.price)throw Error("Not enough ₹ in your wallet.");
    const ownUpdate={inventory:{...(receiver.data().inventory||{}),[r.itemId]:r.item},balance:(receiver.data().balance||0)-r.price,lastTradeId:id};expectedOwnSignature=cloudSignature({...receiver.data(),...ownUpdate});tx.update(receiverRef,ownUpdate);
    if(r.price)tx.update(senderRef,{balance:increment(r.price),lastTradeId:id});
   }else{
    tx.update(senderRef,{["inventory."+r.itemId]:r.item,lastTradeId:id});
   }
   tx.update(ref,{status:accept?"accepted":"declined",resolvedAt:Date.now()});
  });
  const snap=await getDocFromServer(doc(db,"players",uid));
  if(!snap.exists()||auth.currentUser?.uid!==uid)throw Error("Action committed but verification unavailable or account changed. Check cloud state before retrying.");
  if(snap.exists()&&auth.currentUser?.uid===uid&&accept){if(cloudSignature(snap.data())!==expectedOwnSignature)throw Error("Cloud changed after this trade; compare before continuing.");if(cloudSignature(sanitizeForCloud(player))!==localBefore){keepRecoveryCopy(player,null);throw Error("Item action saved online but local progress changed. Device copy kept; compare saves before continuing.")}recordCloudBaseline(uid,snap.data());player.inventory=snap.data().inventory||{};player.balance=snap.data().balance||0;if(snap.data().lastTradeId!==undefined)player.lastTradeId=snap.data().lastTradeId;rememberEconomy(uid,snap.data());saveLocal()}
  tradeError=accept?"Item delivered to My Collection. Virtual wallet transfer complete.":"Request declined. Item returned to sender.";announce(tradeError,true);await refreshTrades();return true;
 });
 }catch(x){tradeError=x.message||x.code||"Could not handle request.";if(/cloud|save|progress|copies/i.test(tradeError))saveCloudFailure(uid,tradeError);announce(tradeError,true);render();return false}finally{economyBusy=false;render()}
}

function lifeLedgerEntry(type,amount,detail,ref){player.lifeLedger=Array.isArray(player.lifeLedger)?player.lifeLedger:[];player.lifeLedger.push({id:ref||safeMatchId(),type,amount,detail,at:Date.now()});if(player.lifeLedger.length>120)player.lifeLedger=player.lifeLedger.slice(-120)}
function monthlyIncomeFor(a){const item=lifeAsset(a);if(!item)return 0;return a.rented&&item.kind==="house"?Math.floor(item.cost*.006):item.kind==="business"&&item.id!=="foundation"?Math.floor(item.cost*.004):0}
function indiaMonth(d=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit"}).format(d)}
function applyVerifiedLife(uid,data){
 if(auth.currentUser?.uid!==uid)return;
 player.balance=data.balance;player.lifeAssets=Array.isArray(data.lifeAssets)?data.lifeAssets:[];
 player.lifeLedger=Array.isArray(data.lifeLedger)?data.lifeLedger:[];
 player.lastLifeMonth=data.lastLifeMonth||"";
 recordCloudBaseline(uid,data);rememberEconomy(uid,data);saveLocal();
 render();
}
let lifeBusy=false;
async function lifeTransaction(fn){
 if(lifeBusy)return false;
 if(!canChangeProfile()){announce("Wait for your profile to finish syncing before changing virtual assets.",true);return false}
 lifeBusy=true;const uid=auth.currentUser.uid,ref=doc(db,"players",uid);
 try{
  if(!await pushCloud())throw Error(err||"Save local changes before changing virtual assets.");
  // Drain prior player writes before checking the authoritative cloud profile.
  return await queuedProfileAction(async()=>{
  const localBefore=cloudSignature(sanitizeForCloud(player));
  const baseline=cloudBaseline?.uid===uid?cloudBaseline.signature:null;
  let did=false,committedSignature=null;
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref),live=snap.exists()?snap.data():null;
   if(!live||baseline!==cloudSignature(live))throw Error("Cloud profile changed. Refresh and compare your copies before investing.");
   if(Number(player.balance)!==Number(live.balance)||exactProfile(player.lifeAssets||[])!==exactProfile(live.lifeAssets||[])||exactProfile(player.lifeLedger||[])!==exactProfile(live.lifeLedger||[]))throw Error("Unsaved local money or assets changed after the save. Save again before investing.");
   const update=fn(live);if(!update)return;
   did=true;committedSignature=cloudSignature({...live,...update});tx.update(ref,update);
   const result={...live,...update};if(result.shareWealth)tx.set(doc(db,"wealthLeaderboard",uid),wealthProfile(result,uid));else tx.delete(doc(db,"wealthLeaderboard",uid));
  });
  if(!did)return false;
  const latest=await getDocFromServer(ref);
  if(!latest.exists()||cloudSignature(latest.data())!==committedSignature)throw Error("Cloud changed after the virtual asset transaction. Compare copies before continuing.");
  if(cloudSignature(sanitizeForCloud(player))!==localBefore){keepRecoveryCopy(player,null);throw Error("Asset action saved online but local progress changed. Compare your device and cloud copies.")}if(auth.currentUser?.uid!==uid)throw Error("Account changed after asset action. Verify that account before retrying.");applyVerifiedLife(uid,latest.data());return true;
  });
 }catch(x){announce("Virtual asset change stopped: "+(x.message||x.code||"cloud error"),true);return false}
 finally{lifeBusy=false}
}
async function settleLifeMonth(){
 const month=indiaMonth();
 return lifeTransaction(live=>{
  if(live.lastLifeMonth===month)return null;
  const assets=Array.isArray(live.lifeAssets)?live.lifeAssets:[];
  const due=assets.reduce((n,a)=>n+monthlyIncomeFor(a),0),payment=Math.min(100000,Math.max(0,due));
  if(!payment)return null;
  const ledger=(Array.isArray(live.lifeLedger)?live.lifeLedger:[]).slice(-119);
  ledger.push({id:"life:"+month,type:"virtual monthly income",amount:payment,detail:"Rent and business income for "+month,at:Date.now()});
  return{lastLifeMonth:month,balance:(Number(live.balance)||0)+payment,lifeLedger:ledger};
 });
}
async function buyLifeAsset(type,name){
 const item=LIFE_CATALOG.find(x=>x.id===type);if(!item)return;
 const brand=item.kind==="business"?String(name||"").trim().slice(0,60):"";
 if(item.kind==="business"&&!brand)return announce("Enter a name for this business.",true);
 if(player.level<item.level||player.balance<item.cost)return announce("Not enough virtual funds or career level.",true);
 if(!confirm(`Buy ${item.name}${brand?" named "+brand:""} for ${money(item.cost)} in virtual game money?`))return;
 const id=safeMatchId();await lifeTransaction(live=>{
  if((Number(live.level)||1)<item.level||(Number(live.balance)||0)<item.cost)throw Error("Not enough virtual funds or level.");
  const assets=Array.isArray(live.lifeAssets)?live.lifeAssets:[],ledger=(Array.isArray(live.lifeLedger)?live.lifeLedger:[]).slice(-119);
  ledger.push({id,type:"asset bought",amount:-item.cost,detail:item.name,at:Date.now()});
  return{balance:live.balance-item.cost,lifeAssets:[...assets,{id,type:item.id,name:brand||item.name,paid:item.cost,boughtAt:Date.now(),rented:false}],lifeLedger:ledger};
 });
}
async function sellLifeAsset(id){
 const asset=lifeAssets().find(a=>a.id===id),item=asset&&lifeAsset(asset);if(!item)return;
 const payout=Math.floor(item.cost*.6);
 if(!confirm(`Sell ${asset.name} back to the game for ${money(payout)} virtual money?`))return;
 await lifeTransaction(live=>{
  const assets=Array.isArray(live.lifeAssets)?live.lifeAssets:[];
  if(!assets.some(a=>a.id===id))throw Error("Asset already sold. Refresh the profile.");
  const ledger=(Array.isArray(live.lifeLedger)?live.lifeLedger:[]).slice(-119);
  ledger.push({id:safeMatchId(),type:"asset sold",amount:payout,detail:item.name,at:Date.now()});
  return{balance:(Number(live.balance)||0)+payout,lifeAssets:assets.filter(a=>a.id!==id),lifeLedger:ledger};
 });
}
async function toggleRental(id){
 const asset=lifeAssets().find(a=>a.id===id);if(!asset||lifeAsset(asset)?.kind!=="house")return;
 await lifeTransaction(live=>{
  const assets=(Array.isArray(live.lifeAssets)?live.lifeAssets:[]).map(a=>({...a}));
  const a=assets.find(x=>x.id===id);
  if(!a||lifeAsset(a)?.kind!=="house")throw Error("House not found.");
  const homes=assets.filter(x=>lifeAsset(x)?.kind==="house"&&!x.rented);
  if(!a.rented&&homes.length<2)throw Error("Keep one home before renting out another.");
  a.rented=!a.rented;
  const ledger=(Array.isArray(live.lifeLedger)?live.lifeLedger:[]).slice(-119);
  ledger.push({id:safeMatchId(),type:"rental setting",amount:0,detail:a.name+": "+(a.rented?"rented":"personal home"),at:Date.now()});
  return{lifeAssets:assets,lifeLedger:ledger};
 });
}

/* ---------------- Render dispatcher ---------------- */
let lastRenderedPage=null,lastDialogLabel=null,dialogReturnFocus=null;
function focusToken(el){
 if(!el||el===document.body)return null;
 return {id:el.id||null,data:Object.fromEntries(Object.entries(el.dataset||{})),tag:el.tagName,value:el.name?el.value:null,name:el.name||null};
}
function findFocus(token){
 if(!token)return null;
 if(token.id){const el=document.getElementById(token.id);if(el)return el}
 return [...root.querySelectorAll("button,input,select,textarea,a,[tabindex]")].find(el=>el.tagName===token.tag&&(token.name?el.name===token.name&&el.value===token.value:Object.keys(token.data).length>0&&Object.entries(token.data).every(([k,v])=>el.dataset[k]===v)));
}
function render(){
 const focused=focusToken(document.activeElement),selection=document.activeElement?.selectionStart;
 renderContent();improveAccessibleNames();
 const menuDialog=root.querySelector("#menuBack [role=dialog]");if(menuDialog){const background=root.querySelector(".wrap");if(background){background.inert=true;background.setAttribute("aria-hidden","true")}}
 const dialog=root.querySelector('[role="dialog"]'),label=dialog?.getAttribute("aria-label")||null,changedPage=lastRenderedPage!==page;
 if(dialog){
  dialog.setAttribute("tabindex","-1");
  if(label!==lastDialogLabel){dialogReturnFocus=focused;dialog.focus()}
  else (findFocus(focused)||dialog).focus();
 }else if(lastDialogLabel){const target=findFocus(dialogReturnFocus)||root.querySelector("h1")||document.getElementById("menuBtn");if(target){if(/^H[1-6]$/.test(target.tagName))target.setAttribute("tabindex","-1");target.focus()}dialogReturnFocus=null}
 else {
  const replacement=!changedPage&&findFocus(focused);
  if(replacement){replacement.focus();if(Number.isInteger(selection)&&typeof replacement.setSelectionRange==="function")try{replacement.setSelectionRange(selection,selection)}catch{}}
  else if(changedPage){const heading=root.querySelector("h1")||root.querySelector("h2")||root.querySelector("main");if(heading){heading.setAttribute("tabindex","-1");heading.focus()}}
 }
 lastRenderedPage=page;lastDialogLabel=label;reconcileDashboard();
}
function protectBusyUI(){
 root.querySelectorAll("button,input,select,textarea,form").forEach(el=>{
  if(recoveryBusy&&el.tagName!=="FORM")el.disabled=true;
  for(const event of ["onclick","onsubmit","onchange","oninput"]){const handler=el[event];if(handler)el[event]=function(ev){if(recoveryBusy){ev?.preventDefault();announce("Recovery is in progress. Wait before making changes.",true);return}return handler.call(this,ev)}}
 });
}
function improveAccessibleNames(){
 root.querySelectorAll("button").forEach(b=>{
  if(b.hasAttribute("aria-label"))return;
  const short=b.textContent.trim();
  if(!["Buy","Sell to game","Remove","Decline","Accept","Collect gift","Reply","Mark as read","Rent extra house","Stop renting","Use this phone copy"].includes(short)&&!b.hasAttribute("data-auction"))return;
  const card=b.closest("li,.card,.squadrow"),context=card?.querySelector("h2,h3,strong,b,span"),text=context?.textContent.trim()||b.dataset.auction||card?.firstChild?.textContent.trim();
  if(text)b.setAttribute("aria-label",short+": "+text);
 });
}
window.addEventListener("keydown",ev=>{
 const dialog=document.querySelector('[role="dialog"]');if(!dialog)return;
 if(ev.key==="Escape"&&menuOpen){ev.preventDefault();menuOpen=false;render();return}
 if(ev.key!=="Tab")return;
 const controls=[...dialog.querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')].filter(el=>!el.disabled&&!el.hidden);
 if(!controls.length){ev.preventDefault();dialog.focus();return}
 const first=controls[0],last=controls.at(-1),inside=dialog.contains(document.activeElement);
 if(ev.shiftKey&&(!inside||document.activeElement===first||document.activeElement===dialog)){ev.preventDefault();last.focus()}
 else if(!ev.shiftKey&&(!inside||document.activeElement===last||document.activeElement===dialog)){ev.preventDefault();first.focus()}
});

 if(booting){loadingScreen();return}

 let ec=document.getElementById("editCoach");if(ec)ec.onclick=()=>{if(confirm("Edit coach profile?")){player.coach=null;page="coach";render()}};
 let cf=document.getElementById("coachForm");if(cf)cf.onsubmit=async(ev)=>{
  ev.preventDefault();
  player.coach={name:document.getElementById("cName").value.trim(),experience:document.getElementById("cExp").value||0,village:document.getElementById("cVillage").value.trim(),state:document.getElementById("cState").value.trim(),academy:document.getElementById("cAcademy").value.trim(),familyBackground:document.getElementById("cFam").value,blindCategory:document.getElementById("cCat").value,role:document.getElementById("cRole").value,teamsCoached:0,winPct:0,salary:0};
  if(await pushCloud()){msg="Coach profile saved online.";announce(msg,true)}else msg=err;
  render();
 };
 document.querySelectorAll("[data-enter]").forEach(b=>b.onclick=()=>beginOfflineTournament(b.dataset.enter));
 document.querySelectorAll("[data-auction]").forEach(b=>b.onclick=()=>{
  let name=b.dataset.auction,a=auctionState();if(a.players.includes(name)||a.players.length>=11||a.budget<auctionPrice())return;
  a.budget-=auctionPrice();a.players.push(name);saveLocal();pushCloud();msg=name+" bought for the simulated auction. Budget remaining "+money(a.budget)+".";announce(msg,true);render();
 });
 protectBusyUI();
}
async function doLogout(){
 if(logoutBusy||recoveryBusy){announce("Wait for recovery before logging out.",true);return}
 logoutBusy=true;logoutNotice="";menuOpen=false;
 announce("Logging out. Please wait.",true);
 msg="Logging out. Please wait.";render();
 logoutTimer=setTimeout(()=>{if(logoutBusy){msg="Logout is taking longer than expected. Check your connection and try again.";announce(msg,true);render()}},10000);
 try{
  await signOut(auth);
  if(auth.currentUser)throw Error("Session is still active. Please try again.");
  stopDashboard();stopIncomingChallenges();fadeBgm(0);stopCommentary();stopResultSound();
  clearLocalSession();player={...freshProfile(),settings:{...DEFAULT_SETTINGS}};
  page="login";match=null;profileReady=false;booting=false;msg="";err="";
  logoutNotice="You have logged out.";announce(logoutNotice,true);render();
 }catch(x){
  msg="Logout failed ("+(x.code||x.message||"network-error")+"). You are still signed in. Try again.";
  announce(msg,true);render();
 }finally{clearTimeout(logoutTimer);logoutTimer=null;logoutBusy=false}
}

/* Keyboard accessibility shortcuts: B = bat/primary action, Ctrl+B = bowl, A = summary */
window.addEventListener("keydown",(ev)=>{
 if(page!=="match"||!canChangeProfile()||ev.defaultPrevented||ev.altKey||ev.metaKey||!match||match.done||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||""))return;
 if(match.awaitingFollowOn||match.awaitingTossChoice||teamChoicePending())return;
 if(ev.key.toLowerCase()==="b"&&!ev.ctrlKey&&match.current==="player"){ev.preventDefault();doPlayerShot("single")}
 else if(ev.key.toLowerCase()==="b"&&ev.ctrlKey&&match.current==="ai"){ev.preventDefault();doPlayerBowl("straight")}
 else if(ev.key.toLowerCase()==="l"&&!ev.ctrlKey&&isTest()){ev.preventDefault();announceTestSituation(true)}
 else if(ev.key.toLowerCase()==="a"){let inn=currentInnings();announce("Score "+inn.runs+" for "+inn.wickets+", over "+Math.floor(inn.balls/6)+"."+(inn.balls%6),true)}
});

render();
</script></body></html>
